openapi: 3.0.0
info:
  title: Real-Time Collaborative Workspace API
  version: 1.0.0
  description: Backend service for real-time collaboration

servers:
  - url: http://localhost:5000/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: User created

  /auth/login:
    post:
      summary: User login
      responses:
        "200":
          description: JWT tokens returned

  /projects:
    post:
      summary: Create project
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Project created

    get:
      summary: Get user projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of projects

  /projects/{id}/invite:
    post:
      summary: Invite collaborator
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User invited
